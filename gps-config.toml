[colors]
track = "#0078ff"
fixed = "#ff5028"
# Ring around the position and beacon dots.
outline = "#ffffff"

# The pages, not the map: the places that carry meaning by color, the surfaces
# the rest is drawn on, and how big the text is.
[ui]
ok = "#3cb44b"
error = "#dc503c"
# A toolbar button flagging that it has no target.
pulse = "#c82828"
# The surfaces and the text everything else is drawn with. Empty follows the
# light/dark theme, which is what keeps these three readable against each other;
# setting one is taking that on yourself.
background = ""
button = ""
text = ""
# Page text size (0.8 - 2.5). The page spacing is measured in text heights, so
# it follows; the map's icons and overlays keep their own sizes.
text_scale = 1.0

[ble]
enabled = true
show_path = false
mac = ""
# Pin a specific beacon instead of scanning for the GPS service:
# mac = "AA:BB:CC:DD:EE:FF"

[track]
min_distance = 3.0
# Draw the phone's own recorded path. Recording is unaffected either way; the
# map bar's path button hides this and the beacon path together.
show_path = true

[sizes]
marker = 8.0
beacon = 6.0
track = 3.0
distance_line = 3.0
distance_text = 14.0

[distance]
show = false
units = "metric"
dotted = true

[compass]
# Heading-up always runs the compass at full rate; these are for north-up and
# tracking, where it only points the arrow on your marker.
marker_arrow = true
arrow_hz = 4.0

[log]
# The CSV log on the Logging page. Empty `file` means a timestamped name
# beside this config; set it by hand or with the page's Save settings button.
auto_start = false
file = ""
# A fixed point every logged position is also measured against, so a range
# test can be read against a surveyed coordinate rather than against a control
# device that is moving too. Both keys or neither.
# ref_lat = 51.4779
# ref_lon = -0.0015
